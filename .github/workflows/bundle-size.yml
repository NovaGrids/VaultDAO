name: Bundle Size

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  size-limit:
    name: Frontend Bundle Size Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # frontend/package.json currently carries a peer-dependency conflict
        # between react-joyride (peer react 15-18) and React 19; the rest of
        # the frontend's npm scripts have the same constraint. Pending that
        # upgrade, installs need --legacy-peer-deps.
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budget
        run: npm run size
