name: Contract Fuzz (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_arithmetic
          - fuzz_create_proposal
          - fuzz_execute_proposal
          - fuzz_spending_limit
          - fuzz_vote_threshold
    defaults:
      run:
        working-directory: contracts/vault
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/vault/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/vault/fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      - name: Run ${{ matrix.target }}
        run: >-
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=${{ github.event.inputs.seconds || '300' }}
          -max_len=4096
          -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: contracts/vault/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
