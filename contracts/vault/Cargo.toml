[package]
name = "vault_dao"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Multi-signature treasury dApp with RBAC on Soroban"
repository = "https://github.com/NovaGrids/VaultDAO"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.8"

[features]
default = []
bridge = []
# Enables the testnet integration test module (src/test_testnet_integration.rs).
testnet = []

[dev-dependencies]
soroban-sdk = { version = "22.0.8", features = ["testutils"] }
proptest = "1"

[[bench]]
name = "contract"
harness = false
