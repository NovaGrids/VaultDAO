##
## VaultDAO — Nginx production server block
##
## Responsibilities:
##   1. Serve the Vite-built SPA from /usr/share/nginx/html
##   2. SPA fallback: any path that is not a real file falls through to index.html
##   3. Security headers on every response
##   4. Gzip compression for text assets
##   5. Cache-busting headers for hashed JS/CSS chunks; no-cache for index.html
##

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # Gzip
    # ----------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ----------------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------------
    add_header X-Frame-Options           "DENY"                   always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy
    # Adjust connect-src to include your deployed Soroban RPC and Horizon endpoints.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: https:; \
         font-src 'self' data:; \
         connect-src 'self' \
           https://soroban-testnet.stellar.org \
           https://horizon-testnet.stellar.org \
           https://rpc-futurenet.stellar.org \
           ${BACKEND_URL:-}; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self';"
        always;

    # Strict-Transport-Security — only effective behind TLS; harmless over plain HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----------------------------------------------------------------
    # Cache control
    # ----------------------------------------------------------------

    # Vite emits hashed filenames for JS/CSS chunks — cache them aggressively.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers must be repeated inside location blocks.
        add_header X-Frame-Options           "DENY"              always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached so the browser always fetches the latest
    # entry point (which references the current hashed chunks).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options           "DENY"              always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # ----------------------------------------------------------------
    # SPA fallback
    # ----------------------------------------------------------------
    # Any request for a path that is not a real file is served index.html
    # so that React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------
    # Health endpoint for Docker / load-balancer probes
    # ----------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }
}
